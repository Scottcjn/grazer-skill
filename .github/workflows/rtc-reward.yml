name: RTC Reward on PR Merge
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reward:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Award RTC to contributor
        continue-on-error: true  # rewards are best-effort; never gate CI
        uses: Scottcjn/rustchain-bounties/actions/rtc-reward@06f36c870b40bdd89f0f92c25826f2d2b9561fa6 # pinned 2026-09-26: skip house accounts (rustchain-bounties#17060)
        env:
          # The action reads GITHUB_TOKEN from env; without it every run crashed
          # ("GITHUB_TOKEN not set"), hidden by continue-on-error. Fixed 2026-09-26.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          node-url: https://50.28.86.131
          amount: 5
          wallet-from: founder_community
          admin-key: ${{ secrets.RTC_ADMIN_KEY }}